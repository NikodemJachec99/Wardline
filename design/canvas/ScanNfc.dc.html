<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan · NFC ready</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFBFC}
.wl{font-family:'Inter',system-ui,-apple-system,sans-serif;color:#0F1720;-webkit-font-smoothing:antialiased}
.wl button{font-family:inherit;color:inherit}
.ring{position:absolute;left:50%;top:50%;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;border:1.5px solid #0E9FA6;opacity:0;animation:wlring 3s cubic-bezier(0.33,1,0.68,1) infinite}
.r2{animation-delay:1s}.r3{animation-delay:2s}
@keyframes wlring{0%{transform:scale(0.42);opacity:0.55}100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion: reduce){.ring{animation:none;opacity:0.18;transform:scale(0.7)}.r2{transform:scale(0.85);opacity:0.12}.r3{transform:scale(1);opacity:0.07}}
</style>
</helmet>
<div class="wl" style="position: relative; width: 390px; height: 844px; background: #FAFBFC; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 59px 8px 0; display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center">
    <button type="button" aria-label="Close scanner" style="width: 48px; height: 48px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
    <span style="text-align: center; font-size: 17px; font-weight: 600">Scan patient</span>
    <span></span>
  </div>
  <div role="tablist" aria-label="Scan method" style="margin: 8px 16px 0; display: flex; padding: 3px; border-radius: 10px; background: #F3F5F8; gap: 2px">
    <button type="button" role="tab" aria-selected="true" style="flex: 1; height: 36px; border: none; border-radius: 8px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(15, 23, 32, 0.08); font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0A7F85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8.32a7.43 7.43 0 0 1 0 7.36"></path><path d="M9.46 6.21a11.76 11.76 0 0 1 0 11.58"></path><path d="M12.91 4.1a15.91 15.91 0 0 1 .01 15.8"></path><path d="M16.37 2a20.16 20.16 0 0 1 0 20"></path></svg>NFC wristband</button>
    <button type="button" role="tab" aria-selected="false" style="flex: 1; height: 36px; border: none; border-radius: 8px; background: transparent; font-size: 14px; font-weight: 500; color: #5B6675; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="5" height="5" x="3" y="3" rx="1"></rect><rect width="5" height="5" x="16" y="3" rx="1"></rect><rect width="5" height="5" x="3" y="16" rx="1"></rect><path d="M21 16h-3a2 2 0 0 0-2 2v3"></path><path d="M12 7v3a2 2 0 0 1-2 2H7"></path></svg>QR code</button>
  </div>

  <div style="position: relative; height: 340px; margin-top: 24px" aria-hidden="true">
    <div style="position: absolute; left: 50%; top: 50%; width: 260px; height: 260px; margin: -130px 0 0 -130px; border-radius: 50%; border: 1px solid #E4E8EE"></div>
    <div style="position: absolute; left: 50%; top: 50%; width: 190px; height: 190px; margin: -95px 0 0 -95px; border-radius: 50%; border: 1px solid #E4E8EE"></div>
    <div class="ring"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div style="position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 60px; background: #E4F5F6; display: flex; align-items: center; justify-content: center">
      <div style="width: 84px; height: 84px; border-radius: 42px; background: #0E9FA6; box-shadow: 0 6px 20px rgba(14, 159, 166, 0.25); display: flex; align-items: center; justify-content: center"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.32a7.43 7.43 0 0 1 0 7.36"></path><path d="M9.46 6.21a11.76 11.76 0 0 1 0 11.58"></path><path d="M12.91 4.1a15.91 15.91 0 0 1 .01 15.8"></path><path d="M16.37 2a20.16 20.16 0 0 1 0 20"></path></svg></div>
    </div>
  </div>

  <div style="padding: 0 32px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
    <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em">Hold your phone near the patient's wristband</h1>
    <p style="margin: 0; font-size: 15px; line-height: 21px; color: #5B6675">Top edge of the iPhone, 1–2 cm from the band.</p>
  </div>

  <div style="margin: 20px 16px 0; padding: 10px 14px; border-radius: 12px; background: #F3F5F8; display: flex; align-items: center; gap: 10px; font-size: 13px; line-height: 18px; color: #4F5967"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>Scanning opens the record — it never moves the patient.</div>

  <div style="margin-top: auto; padding: 0 16px 34px; display: flex; flex-direction: column; gap: 8px">
    <button type="button" style="height: 56px; border: none; border-radius: 12px; background: #0A7F85; color: #FFFFFF; font-size: 16px; font-weight: 600">Start scanning</button>
    <button type="button" style="height: 48px; border: none; border-radius: 12px; background: transparent; font-size: 15px; font-weight: 600">Cancel</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
