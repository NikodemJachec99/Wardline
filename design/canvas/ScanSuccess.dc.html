<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan · Read success and quick summary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFBFC}
.wl{font-family:'Inter',system-ui,-apple-system,sans-serif;color:#0F1720;-webkit-font-smoothing:antialiased}
.tn{font-variant-numeric:tabular-nums}
.id{font-variant-numeric:tabular-nums slashed-zero;letter-spacing:0.02em}
.wl button{font-family:inherit;color:inherit}
.glow{animation:wlbright 380ms cubic-bezier(0.33,1,0.68,1) both}
@keyframes wlbright{0%{background-color:#F3F5F8;transform:scale(0.92)}100%{background-color:#D5F0F1;transform:scale(1)}}
.pop{animation:wlpop 220ms cubic-bezier(0.33,1,0.68,1) 120ms both}
@keyframes wlpop{0%{transform:scale(0.6);opacity:0}100%{transform:scale(1);opacity:1}}
.sheet{animation:wlsheet 420ms cubic-bezier(0.22,1,0.36,1) 300ms both}
@keyframes wlsheet{0%{transform:translateY(100%)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){.glow,.pop{animation:none}.sheet{animation:wlfade 120ms linear 300ms both}@keyframes wlfade{0%{opacity:0}100%{opacity:1}}}
</style>
</helmet>
<div class="wl" style="position: relative; width: 390px; height: 844px; background: #FAFBFC; overflow: hidden">
  <div style="padding: 59px 8px 0; display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center">
    <button type="button" aria-label="Close scanner" style="width: 48px; height: 48px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
    <span style="text-align: center; font-size: 17px; font-weight: 600">Scan patient</span>
    <span></span>
  </div>

  <div style="position: relative; height: 270px; margin-top: 16px" aria-hidden="true">
    <div class="glow" style="position: absolute; left: 50%; top: 50%; width: 240px; height: 240px; margin: -120px 0 0 -120px; border-radius: 50%; background: #D5F0F1"></div>
    <div style="position: absolute; left: 50%; top: 50%; width: 160px; height: 160px; margin: -80px 0 0 -80px; border-radius: 50%; background: #E4F5F6"></div>
    <div class="pop" style="position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 46px; background: #0E9FA6; box-shadow: 0 6px 20px rgba(14, 159, 166, 0.3); display: flex; align-items: center; justify-content: center"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div>
  </div>
  <div style="display: flex; justify-content: center">
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: #FFFFFF; border: 1px solid #E4E8EE; font-size: 12px; font-weight: 500; color: #5B6675"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0A7F85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 8 2 2-2 2 2 2-2 2"></path><path d="m22 8-2 2 2 2-2 2 2 2"></path><rect width="8" height="14" x="8" y="5" rx="1"></rect></svg>Wristband read · success haptic</span>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(15, 23, 32, 0.12); pointer-events: none"></div>

  <div class="sheet" role="dialog" aria-label="Patient identified" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 32px rgba(15, 23, 32, 0.12); padding: 8px 16px 34px; display: flex; flex-direction: column; gap: 14px">
    <div style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #CBD2DB"></div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #0A7F85"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8.32a7.43 7.43 0 0 1 0 7.36"></path><path d="M9.46 6.21a11.76 11.76 0 0 1 0 11.58"></path><path d="M12.91 4.1a15.91 15.91 0 0 1 .01 15.8"></path><path d="M16.37 2a20.16 20.16 0 0 1 0 20"></path></svg>Patient identified</span>
      <span class="tn" style="font-size: 12px; color: #5B6675">NFC · 10:44</span>
    </div>
    <div style="display: flex; gap: 12px; align-items: center">
      <div style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 28px; background: #F3F5F8; border: 1px solid #E4E8EE; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; color: #5B6675">JK</div>
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em">Jan Kowalczyk</span><span style="font-size: 14px; color: #5B6675"><span class="tn">54</span> · <span class="id">HPT-7K3M9QX2</span></span></div>
    </div>
    <div style="border: 1px solid #E4E8EE; border-radius: 12px">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid #E4E8EE"><span style="font-size: 13px; color: #5B6675">Status</span><span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; background: #F1ECFC; color: #6236C0; font-size: 13px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>In Treatment</span></div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 14px"><span style="font-size: 13px; color: #5B6675">Last location</span><span style="display: flex; flex-direction: column; align-items: flex-end"><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>Laboratory</span><span class="tn" style="font-size: 12px; color: #5B6675">since 10:31 · 13 min</span></span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <button type="button" style="height: 56px; border: none; border-radius: 12px; background: #0A7F85; color: #FFFFFF; font-size: 16px; font-weight: 600">View profile</button>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="height: 48px; border: 1px solid #CBD2DB; border-radius: 12px; background: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></svg>History</button>
        <sc-if value="{{ isNurse }}" hint-placeholder-val="{{ true }}">
          <button type="button" style="height: 48px; border: 1px solid #CBD2DB; border-radius: 12px; background: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px">Transfer<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></button>
        </sc-if>
        <sc-if value="{{ isDoctor }}" hint-placeholder-val="{{ false }}">
          <button type="button" style="height: 48px; border: 1px solid #CBD2DB; border-radius: 12px; background: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px">Change status<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></button>
        </sc-if>
      </div>
      <span style="font-size: 12px; color: #5B6675; text-align: center">Nothing has changed. {{ roleHint }}</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["Nurse","Doctor"],"default":"Nurse"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const role = this.props.role ?? 'Nurse';
    return {
      isNurse: role === 'Nurse',
      isDoctor: role === 'Doctor',
      roleHint: role === 'Nurse' ? 'Transfer opens a separate confirm step.' : 'Status changes open a separate confirm step.'
    };
  }
}
</script>
</body>
</html>
