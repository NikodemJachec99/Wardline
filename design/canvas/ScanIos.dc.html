  </div>
  <div style="position: absolute; inset: 0; background: rgba(15, 23, 32, 0.32)"></div>

    <span style="font-size: 20px; font-weight: 600; color: #4F5967">"Ready to Scan"</span>

      <span style="font-size: 12px; font-weight: 600; color: #5B6675">Our text, passed as alertMessage:</span>

    <span style="font-size: 12px; line-height: 17px; color: #5B6675; max-width: 280px">Drawn and animated by iOS, not by Wardline. We can't style it, so we don't mock it.</span>
