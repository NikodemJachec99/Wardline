<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo mode · Showcase</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFBFC}
.wl{font-family:'Inter',system-ui,-apple-system,sans-serif;color:#0F1720;-webkit-font-smoothing:antialiased}
.wl *{box-sizing:border-box}
.wl button{font-family:inherit;color:inherit;cursor:pointer}
.tn{font-variant-numeric:tabular-nums}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.pulse{animation:wlpulse 1.6s cubic-bezier(.33,1,.68,1) infinite}
@keyframes wlpulse{0%{box-shadow:0 0 0 0 rgba(14,159,166,.5)}100%{box-shadow:0 0 0 7px rgba(14,159,166,0)}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
</style>
</helmet>
<div class="wl" style="position: relative; width: 390px; height: 844px; background: #FAFBFC; overflow: hidden; display: flex; flex-direction: column">
  <div style="padding: 59px 8px 0"><a href="#" style="height: 48px; display: inline-flex; align-items: center; gap: 2px; padding: 0 8px; text-decoration: none; color: #0A7F85; font-size: 16px; font-weight: 500"><svg class="i" viewBox="0 0 24 24" style="width: 22px; height: 22px; stroke-width: 2"><path d="m15 18-6-6 6-6"/></svg>Admin</a></div>
  <div style="padding: 0 16px; display: flex; justify-content: space-between; align-items: center"><h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.02em">Showcase</h1><span style="height: 26px; padding: 0 9px; border-radius: 8px; background: #F0F2F5; color: #4F5967; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center">Admin only</span></div>
  <p style="margin: 6px 16px 0; font-size: 14px; line-height: 20px; color: #5B6675">One-tap scenarios for presentations. Uses the simulation data set only.</p>

  <div style="margin: 16px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{ items }}" as="s" hint-placeholder-count="4">
      <div style="{{ s.box }}">
        <span style="{{ s.icon }}">
          <sc-if value="{{ s.isLive }}" hint-placeholder-val="{{ true }}"><svg class="i" viewBox="0 0 24 24"><path d="m16 3 4 4-4 4M20 7H4M8 21l-4-4 4-4M4 17h16"/></svg></sc-if>
          <sc-if value="{{ s.isSync }}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24"><rect width="10" height="16" x="2" y="4" rx="2"/><rect width="10" height="16" x="12" y="4" rx="2"/><path d="M7 12h10"/></svg></sc-if>
          <sc-if value="{{ s.isConflict }}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24"><path d="m21.7 18-8-14a2 2 0 0 0-3.5 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3M12 9v4M12 17h.01"/></svg></sc-if>
          <sc-if value="{{ s.isOffline }}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24"><path d="M12 20h.01M8.5 16.4a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 5.2-2.7M19 12.9a10 10 0 0 0-2-1.5M2 8.8a15 15 0 0 1 4.2-2.6M22 8.8a15 15 0 0 0-11.3-3.8M2 2l20 20"/></svg></sc-if>
        </span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 600">{{ s.title }}</span>
          <span style="font-size: 13px; line-height: 18px; color: #5B6675">{{ s.desc }}</span>
          <sc-if value="{{ s.running }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #0A7F85; margin-top: 4px"><span class="pulse" style="width: 8px; height: 8px; border-radius: 4px; background: #0E9FA6"></span>{{ s.status }}</span></sc-if>
        </div>
        <button type="button" onClick="{{ s.toggle }}" aria-pressed="{{ s.pressed }}" style="{{ s.btn }}">{{ s.btnLabel }}</button>
      </div>
    </sc-for>
  </div>

  <div style="margin: 16px 16px 0; padding: 12px 14px; border-radius: 12px; background: #F3F5F8; display: flex; gap: 10px; font-size: 13px; line-height: 18px; color: #4F5967"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px; margin-top: 1px"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>Scenarios run on the server, so every signed-in device sees them, exactly like real events.</span></div>
  <div style="margin-top: auto; padding: 0 16px 34px"><button type="button" onClick="{{ reset }}" style="width: 100%; height: 52px; border: 1px solid #CBD2DB; border-radius: 12px; background: #fff; font-size: 15px; font-weight: 600">Reset simulation data</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { run: null }; }
  renderVals() {
    const list = [
      { id: 'live', title: 'Live transfers', desc: 'A transfer every 20 s between random departments.', status: 'Running · 3 transfers sent' },
      { id: 'sync', title: 'Realtime sync on 2 devices', desc: 'Pair a second phone with code 4821, then move a patient on one.', status: 'Waiting for second device · code 4821' },
      { id: 'conflict', title: 'Conflict', desc: 'Marek Kowal moves Jan Kowalczyk while you are confirming.', status: 'Armed · confirm any transfer of Jan' },
      { id: 'offline', title: 'Offline', desc: 'Simulates lost connection for 60 s on this device.', status: 'Offline for 0:52' }
    ];
    const items = list.map((s) => {
      const on = this.state.run === s.id;
      return {
        title: s.title, desc: s.desc, status: s.status, running: on, pressed: on ? 'true' : 'false',
        isLive: s.id === 'live', isSync: s.id === 'sync', isConflict: s.id === 'conflict', isOffline: s.id === 'offline',
        toggle: () => this.setState({ run: on ? null : s.id }),
        btnLabel: on ? 'Stop' : 'Run',
        box: 'display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: ' + (on ? '1.5px solid #0E9FA6' : '1px solid #E4E8EE') + ';',
        icon: 'width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; ' + (on ? 'background: #0E9FA6; color: #FFFFFF;' : 'background: #E4F5F6; color: #0A7F85;'),
        btn: 'height: 44px; min-width: 64px; padding: 0 14px; border-radius: 12px; font-size: 15px; font-weight: 600; ' + (on ? 'border: 1px solid #CBD2DB; background: #FFFFFF; color: #0F1720;' : 'border: none; background: #0A7F85; color: #FFFFFF;')
      };
    });
    return { items, reset: () => this.setState({ run: null }) };
  }
}
</script>
</body>
</html>
