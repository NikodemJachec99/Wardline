name: wardline
description: "Wardline — Hospital Patient Tracking System. SIMULATION ONLY, fictional data."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

# Only what the skeleton needs to compile. Feature issues add their own packages
# (supabase_flutter, drift, nfc_manager, mobile_scanner, ...).
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.3
  lucide_icons_flutter: ^4.0.3
  nfc_manager: ^4.4.0
  nfc_manager_ndef: ^1.1.0
  mobile_scanner: ^7.5.0
  app_settings: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Fictional demo hospital (copy of design/handoff/sample-data.json).
    - assets/demo/

  # Inter (SIL OFL 1.1, see assets/fonts/OFL.txt). Bundled so it works offline.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
